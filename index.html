<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<title>EG Studio — KTU Engineering Graphics</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%231E1D1B'/%3E%3Cpath d='M3 12l10-4v16l-10-4z' fill='none' stroke='%23D8432B' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='7' fill='none' stroke='%23D8432B' stroke-width='2'/%3E%3Ccircle cx='23' cy='16' r='3' fill='none' stroke='%23D8432B' stroke-width='2'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<a class="skip" href="#workbench">Skip to drawing</a>

<header class="app-header">
  <button id="navToggle" class="nav-toggle" aria-label="Hide module list" aria-controls="sidebar" aria-expanded="true">
    <span class="bars" aria-hidden="true"><span></span><span></span><span></span></span><span class="nt-label">Modules</span>
  </button>
  <div class="brand">
    <!-- first-angle projection symbol (BIS SP:46) used as the brand mark -->
    <svg class="brand-mark" viewBox="0 0 44 24" aria-hidden="true">
      <path d="M3 8L17 3v18L3 16z"/><circle cx="33" cy="12" r="9"/><circle cx="33" cy="12" r="4.5"/>
      <path class="cl" d="M0 12h44M33 1v22"/>
    </svg>
    <div>
      <h1>EG Studio</h1>
      <p class="tagline">KTU Engineering Graphics · First angle projection</p>
    </div>
  </div>
  <div class="header-right">
    <span class="header-meta">BIS SP:46 · all dimensions in mm</span>
    <button id="themeToggle" class="theme-toggle" type="button" aria-pressed="false" title="Switch light / dark">
      <span class="tt-label">Light</span>
    </button>
  </div>
</header>

<div class="layout">
  <!-- Module navigation -->
  <nav id="sidebar" class="sidebar" aria-label="Modules">
    <div class="sidebar-section-title">Modules</div>
    <ul id="moduleList" class="module-list"><!-- filled by JS --></ul>
    <div class="sidebar-footer">
      <p>First angle projection<br/>Indian standard (BIS SP:46)</p>
    </div>
  </nav>
  <div id="navScrim" class="nav-scrim" hidden></div>

  <!-- Main workbench (rendered by workbench.js) -->
  <main id="workbench" class="workbench" tabindex="-1"></main>
</div>

<!-- Vendored libraries (work fully offline) -->
<script src="vendor/three.min.js"></script>
<script src="vendor/jspdf.umd.min.js"></script>

<!-- Core engine: math (geometry) is separate from rendering (svg2d, three3d) -->
<script src="js/core/geometry.js"></script>
<script src="js/core/svg2d.js"></script>
<script src="js/core/three3d.js"></script>
<script src="js/core/exporter.js"></script>
<script src="js/core/workbench.js"></script>

<!-- Data -->
<script src="js/data/problems.js"></script>

<!-- App controller (defines App.register used by the modules below) -->
<script src="js/app.js"></script>

<!-- Modules -->
<script src="js/modules/points.js"></script>
<script src="js/modules/lines.js"></script>
<script src="js/modules/planes.js"></script>
<script src="js/modules/solids.js"></script>
<script src="js/modules/sections.js"></script>
<script src="js/modules/development.js"></script>
<script src="js/modules/isometric.js"></script>
<script src="js/modules/perspective.js"></script>
<script src="js/modules/conversion.js"></script>
<script src="js/modules/intersection.js"></script>
</body>
</html>
